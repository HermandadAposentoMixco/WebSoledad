 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registros Devotos</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    padding:40px;
}

h1{
    text-align:center;
}

input{
    width:300px;
    padding:10px;
    margin-bottom:20px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#111;
    color:white;
    padding:10px;
}

td{
    padding:8px;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

tr:hover{
    background:#f0f0f0;
}

.container{
    max-width:1200px;
    margin:auto;
}

</style>
</head>

<body>

<div class="container">

<h1>Registros de Devotos</h1>

<input type="text" id="buscar" placeholder="Buscar por nombre, CUI o teléfono">

<table>

<thead>
<tr>
<th>ID</th>
<th>CUI</th>
<th>Nombres</th>
<th>Apellidos</th>
<th>Teléfono</th>
<th>Correo</th>
<th>Dirección</th>
<th>Fecha N.</th>
<th>Nota</th>
<th>Genero</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<script>

let registros = []

async function cargarRegistros(){

    const res = await fetch("/api/devotos")
    registros = await res.json()

    mostrar(registros)

}

function mostrar(data){

    const tabla = document.getElementById("tabla")
    tabla.innerHTML = ""

    data.forEach(devoto => {

        tabla.innerHTML += `
        <tr>
        <td>${devoto.id}</td>
        <td>${devoto.cui}</td>
        <td>${devoto.nombres}</td>
        <td>${devoto.apellidos}</td>
        <td>${devoto.telefono}</td>
        <td>${devoto.correo}</td>
        <td>${devoto.direccion}</td>
        <td>${devoto.fn}</td>
        <td>${devoto.nota}</td>
        <td>${devoto.sexo}</td>
        </tr>
        `
    })

}

document.getElementById("buscar").addEventListener("keyup", e => {

    const texto = e.target.value.toLowerCase()

    const filtrado = registros.filter(r => 
        r.nombres.toLowerCase().includes(texto) ||
        r.apellidos.toLowerCase().includes(texto) ||
        r.cui.includes(texto) ||
        r.telefono.includes(texto)
    )

    mostrar(filtrado)

})

cargarRegistros()

</script>

</body>
</html>
